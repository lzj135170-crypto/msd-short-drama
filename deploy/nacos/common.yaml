# 码上短剧公共配置
# 由 scripts/init-nacos-config.py 发布到 Nacos
# namespace=mashang-duanju-{{ENV}}, group=DEFAULT_GROUP, dataId=common.yaml
msd:
  env:
    name: "{{ENV}}"
  security:
    # 网关/Agent/Audit 服务间 token；为空时 dev fail-open，生产必须设置 MSD_INTERNAL_TOKEN
    internal-token: ${MSD_INTERNAL_TOKEN:}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/DL?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: msd
    password: "{{MSD_DB_PASSWORD}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      initialization-fail-timeout: -1
  data:
    redis:
      host: 192.168.33.129
      port: 6379
      password: "{{REDIS_PASSWORD}}"
      database: 0
      timeout: 2s
  kafka:
    bootstrap-servers: 192.168.33.129:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # broker 不可用时 send 最多阻塞 5 秒，避免 outbox relay 长时间占用数据库事务
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: msd-tx-group
  service:
    vgroup-mapping:
      msd-tx-group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:mashang-duanju-${spring.profiles.active}}
      group: SEATA_GROUP
      cluster: default

management:
  tracing:
    # 按环境渲染：dev 1.0、test 0.5、prod 0.1
    sampling:
      probability: {{TRACING_SAMPLING}}
    # Boot 4 前缀；旧 management.zipkin.tracing.* 已不再读取
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  pattern:
    # 日志中带上 traceId/spanId，便于和 Zipkin 对照
    correlation: "[%X{traceId:-},%X{spanId:-}] "
